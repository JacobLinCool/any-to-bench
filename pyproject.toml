[project]
name = "any-to-bench"
version = "0.1.1"
description = "Convert any exam materials (photos, PDFs, answer keys, rubrics) into a machine-gradable benchmark"
readme = "README.md"
authors = [
    { name = "JacobLinCool", email = "jacoblincool@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["benchmark", "exam", "llm", "evaluation", "grading", "dataset"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "pydantic-ai-slim[openai,google]>=2.30",
    "typer>=0.27",
    "pypdfium2>=5.13",
    "pillow>=12",
    "jsonschema>=4.26",
    "python-dotenv>=1.2",
    "datasets>=5.0",
]

[project.urls]
Repository = "https://github.com/JacobLinCool/any-to-bench"
Issues = "https://github.com/JacobLinCool/any-to-bench/issues"

[project.scripts]
any-to-bench = "any_to_bench.cli:app"
a2b = "any_to_bench.cli:app"

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
    "dirty-equals>=0.11",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
