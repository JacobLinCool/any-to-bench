      THESIS: The pre-printed structure is in an ink the machine cannot see; only the marks count.
        Refuses the dev-tool dark hero, exam-paper pastiche, and stock DaisyUI alike.
      OWN-WORLD: An OMR answer card on a scanner bed. Cool card stock lifted off deep slate;
        drop-out cyan owns every pre-printed rule, grid and field; graphite is content that counts;
        cinnabar is reserved for the act that commits, the seal over the answer key, and refusal.
        Zero radii, one authored elevation, Archivo and Spline Sans Mono, tabular numerals.
      STORY: A visitor opens a real bundle, reads the paper as issued, then breaks the seal.
      FIRST VIEWPORT: The register of issued cards for one repo — numbered stubs ruled into
        sections by examination and year — over the reading sheet each one opens into.
      FORM: The Answer Card; candidate 1 of the grounded list; seed key 39dd11ac.
